<header>

<main>
    <div class="div-form">

        <form class="form-class" method="post">

            <label><strong>doador_id:</strong></label><br>
            <input type="text" name="doador_id"><br><br>

            <label><strong>ong_id:</strong></label><br>
            <input type="text" name="ong_id"><br><br>

            <label><strong>valor:</strong></label><br>
            <input type="text" name="valor"><br><br>

            <label><strong>observações:</strong></label><br>

            <input type="submit" value="Inserir" class="submit">

        <br><br><br>

        <!-- Tabela -->
        <table class="tabela">

                <tr>
                    <th>doacao_id</th>

                    <th>forma_pagamento</th>
                    <th>observacoes</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7" style="text-align:center;">(dados)</td></tr>
            </tbody>
        </table>

        <br><br>

        <div class="div-botao">
            <input type="submit" value="Atualizar" class="submit">
            <input type="submit" value="Excluir" class="submit">
